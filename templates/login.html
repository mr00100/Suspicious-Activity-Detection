<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAD | Secure Access</title><link rel="stylesheet" href="/static/app.css"></head><body class="auth"><canvas id="matrixRain" aria-hidden="true"></canvas><script>
(function(){const c=document.getElementById('matrixRain');if(!c)return;const x=c.getContext('2d');let w=0,h=0,d=[];const chars='01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%<>[]{}';function resize(){w=c.width=innerWidth*devicePixelRatio;h=c.height=innerHeight*devicePixelRatio;c.style.width='100vw';c.style.height='100vh';x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);w=innerWidth;h=innerHeight;d=Array.from({length:Math.ceil(w/16)},()=>Math.random()*-60)}function draw(){x.fillStyle='rgba(8,0,3,.16)';x.fillRect(0,0,w,h);x.font='13px Consolas,monospace';x.fillStyle='rgba(255,35,60,.82)';for(let i=0;i<d.length;i++){x.fillText(chars[Math.floor(Math.random()*chars.length)],i*16,d[i]*16);if(d[i]*16>h&&Math.random()>.975)d[i]=Math.random()*-20;d[i]+=1}requestAnimationFrame(draw)}resize();addEventListener('resize',resize);draw()})();
</script><div class="auth-card"><div class="brand"><span class="dot"></span>SAD <small>SECURITY MONITORING</small></div><h1>Secure Access</h1><p>Suspicious Activity Detection & Monitoring</p><input id="user" placeholder="Username" value="admin"><input id="pass" type="password" placeholder="Password" value="Admin@123"><button id="loginBtn" onclick="login()"><span> SIGN IN </span><i class="btn-loader"></i></button><div id="msg"></div><div class="demo">Demo admin: admin / Admin@123 · Student: student / Student@123</div></div><script>
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;b.classList.remove('click-flash');void b.offsetWidth;b.classList.add('click-flash')});
async function login(){
 const btn=document.getElementById('loginBtn'), msg=document.getElementById('msg');
 btn.classList.add('loading'); btn.disabled=true; msg.textContent='AUTHENTICATING…'; msg.className='loading-msg';
 try{let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user.value,password:pass.value})});let j=await r.json();if(r.ok){msg.textContent='LOGIN SUCCESSFUL ✓';msg.className='success-msg';setTimeout(()=>location.href=j.redirect_url||(['ADMIN','SUPER_ADMIN','SUPERVISOR'].includes(j.role)?'/admin':'/'),650)}else{msg.textContent=j.error||'Login failed';msg.className='error-msg';btn.classList.remove('loading');btn.disabled=false}}catch(e){msg.textContent='Connection error';msg.className='error-msg';btn.classList.remove('loading');btn.disabled=false}}</script></body></html>
